[tool.poetry]
name = "infrahub-demo-ixp"
version = "0.1.4"
description = "Infrahub - Demo repository for IXPs"
authors = ["OpsMill <info@opsmill.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10, < 3.13"
# infrahub-sdk = {version = "^1.9.1", extras = ["all"]}
infrahub-sdk = {git = "https://github.com/opsmill/infrahub-sdk-python.git", rev = "dga-20250330-object-cmd", extras = ["all"]}
typer = "^0.12.3"
pygnmi = "^0.6.9"
invoke = "^2.1.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
